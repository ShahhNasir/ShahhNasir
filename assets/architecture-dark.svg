<svg width="1240" height="800" viewBox="0 0 1240 800" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Segoe UI',monospace" role="img" aria-label="AI OS system architecture diagram (dark)">
  <defs>
    <linearGradient id="edgeGradD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="nodeStrokeD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="nodeGlowD" x="-50%" y="-50%" width="200%" height="200%">
