  <text x="620" y="76" text-anchor="middle" fill="#64748B" font-size="13">production-grade applied AI platform</text>

  <g stroke="url(#edgeGradD)" stroke-width="2.5" fill="none" marker-end="url(#arrowD)">
    <path d="M215,150 H345"/>
    <path d="M535,150 H615"/>
