<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Segoe UI',monospace" role="img" aria-label="AI OS flagship project card">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glassSheen" cx="20%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="markGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip"><rect x="4" y="4" width="892" height="412" rx="26"/></clipPath>
  </defs>

  <!-- outer glow border -->
  <rect x="1" y="1" width="898" height="418" rx="28" fill="url(#cardBorder)" opacity="0.9"/>
  <rect x="4" y="4" width="892" height="412" rx="26" fill="url(#cardBg)"/>

  <g clip-path="url(#cardClip)">
    <circle cx="120" cy="80" r="160" fill="url(#orb1)" filter="url(#softBlur)"/>
    <circle cx="780" cy="360" r="180" fill="url(#orb2)" filter="url(#softBlur)"/>
    <rect x="4" y="4" width="892" height="412" fill="url(#glassSheen)"/>
    <!-- glass panel divider -->
    <rect x="40" y="230" width="820" height="1" fill="#334155"/>
  </g>

  <rect x="4.5" y="4.5" width="891" height="411" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- badge -->
  <rect x="40" y="40" width="132" height="30" rx="15" fill="#111827" stroke="#22D3EE" stroke-opacity="0.6"/>
  <circle cx="58" cy="55" r="4" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="59" fill="#67E8F9" font-size="11" font-weight="700" letter-spacing="1">FLAGSHIP</text>

  <!-- mark -->
  <g transform="translate(40,90)" filter="url(#markGlow)">
    <circle cx="30" cy="30" r="30" fill="none" stroke="url(#cardBorder)" stroke-width="2" opacity="0.6"/>
    <circle cx="30" cy="12" r="7" fill="#22D3EE"/>
    <circle cx="46" cy="40" r="7" fill="#3B82F6"/>
    <circle cx="14" cy="40" r="7" fill="#A855F7"/>
    <circle cx="30" cy="30" r="10" fill="#EAFDFF"/>
  </g>

  <text x="112" y="115" fill="#F8FAFC" font-size="30" font-weight="800" letter-spacing="0.5">AI OS</text>
  <text x="112" y="140" fill="#94A3B8" font-size="13">The Operating System for Artificial Intelligence</text>

  <text x="40" y="190" fill="#CBD5E1" font-size="13">Production-grade applied AI platform unifying agents, RAG,</text>
  <text x="40" y="210" fill="#CBD5E1" font-size="13">retrieval infrastructure, evaluation and observability.</text>

  <!-- tech pills -->
  <g font-size="11" font-weight="600" fill="#E2E8F0">
    <rect x="40" y="260" width="88" height="28" rx="14" fill="#111827" stroke="#334155"/>
    <text x="84" y="278" text-anchor="middle">FastAPI</text>

    <rect x="136" y="260" width="100" height="28" rx="14" fill="#111827" stroke="#334155"/>
    <text x="186" y="278" text-anchor="middle">LangGraph</text>

    <rect x="244" y="260" width="118" height="28" rx="14" fill="#111827" stroke="#334155"/>
    <text x="303" y="278" text-anchor="middle">Vector DB</text>

    <rect x="370" y="260" width="98" height="28" rx="14" fill="#111827" stroke="#334155"/>
    <text x="419" y="278" text-anchor="middle">Postgres</text>

    <rect x="476" y="260" width="82" height="28" rx="14" fill="#111827" stroke="#334155"/>
    <text x="517" y="278" text-anchor="middle">Redis</text>

    <rect x="566" y="260" width="86" height="28" rx="14" fill="#111827" stroke="#334155"/>
    <text x="609" y="278" text-anchor="middle">Kafka</text>

    <rect x="660" y="260" width="120" height="28" rx="14" fill="#111827" stroke="#334155"/>
    <text x="720" y="278" text-anchor="middle">Kubernetes</text>
  </g>

  <!-- footer row -->
  <text x="40" y="345" fill="#64748B" font-size="11">agents · rag · evaluation · mlops · distributed systems</text>

  <g transform="translate(700,320)">
    <rect x="0" y="0" width="160" height="46" rx="12" fill="none" stroke="url(#cardBorder)" stroke-width="1.5"/>
    <text x="80" y="29" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">View Repository →</text>
  </g>
</svg>
